name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Use a local copy of three.js so the game works offline
        run: |
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          grep -c 'src="three.min.js"' www/index.html

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Landscape, full screen and edge to edge
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$MAN"
          mkdir -p android/app/src/main/java/ng/gtl/game
          cat > android/app/src/main/java/ng/gtl/game/MainActivity.java <<'JAVA'
          package ng.gtl.game;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private void immersive() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              WindowInsetsControllerCompat c = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
            @Override public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              immersive();
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) immersive();
            }
          }
          JAVA
          sed -i 's/^          //' android/app/src/main/java/ng/gtl/game/MainActivity.java

      - name: Use the same signing key every build so updates install over the old app
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Force the Gradle debug build to sign with our committed key
        run: |
          python3 tools/patch_signing.py
          sed -n 1,30p android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Check the APK is signed with our committed key
        run: |
          WANT=$(keytool -list -v -keystore debug.keystore -storepass android | grep 'SHA256:' | head -1 | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "committed key: $WANT"
          echo "apk signed by: $GOT"
          test "$WANT" = "$GOT"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: GTL-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GTL.apk
          gh release create "build-${{ github.run_number }}" GTL.apk --title "GTL build ${{ github.run_number }}" --notes "Android test APK (debug)." --latest
