name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Use a local copy of three.js so the game works offline
        run: |
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          grep -c 'src="three.min.js"' www/index.html

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Landscape and full screen
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$MAN"
          STY=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$STY" || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: GTL-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GTL.apk
          gh release create "build-${{ github.run_number }}" GTL.apk --title "GTL build ${{ github.run_number }}" --notes "Android test APK (debug)." --latest
